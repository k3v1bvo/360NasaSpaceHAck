name: geothermo
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch>=2.2
  - geopandas>=0.14
  - rasterio>=1.3
  - shapely>=2.0
  - fastapi>=0.104
  - pydantic>=2.5
  - scipy>=1.11
  - xarray>=2023.10
  - uvicorn>=0.24
  - httpx
  - aiofiles
  - python-dotenv
  - psycopg2-binary
  - pytest
  - pip
  - pip:
      - neuraloperator
      - langgraph>=0.2
      - earthaccess>=0.8
      - trimesh>=4.0
